<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
	<h1>Rock Paper Scissors</h1>
	<label for="game-number">Number of turns</label>
	<!-- Added data-ns-test="game-number" -->
	<input type="number" id="game-number" data-ns-test="game-number">

	<div class="results">
		 <!-- Added data-ns-test attributes for points, rounds, choices, and results -->
		 <div id="user-points" data-ns-test="user-points">0</div>
		 <br>
		 <div id="computer-points" data-ns-test="computer-points">0</div>
		 <br>
		 <div id="rounds-left" data-ns-test="rounds-left">0</div>
		 <br>
		 <div id="computer-choose" data-ns-test="computer-choose">-</div>
		 <br>
		 <div id="round-result" data-ns-test="round-result">........</div>
		 <br>
		 <div id="game-result" data-ns-test="game-result"></div>
	</div>
	
	<br><br>
	<div class="content">
		 <!-- Added data-ns-test item choices -->
		 <button class="item" id="rock" data-ns-test="rock">🪨 Rock</button>
		 <button class="item" id="paper" data-ns-test="paper">📄 Paper</button>
		 <button class="item" id="scissors" data-ns-test="scissors">✂️ Scissors</button>
	</div>

	<!-- Added data-ns-test="play-game" -->
	<button id="play-game" data-ns-test="play-game">Play</button>
</div>
	
    <script type="text/javascript" src="./script.js"></script>
</body>
</html>
